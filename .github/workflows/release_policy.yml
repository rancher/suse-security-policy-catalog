name: Release Policy

# The policies repository sends a release-policy event for each published
# policy release. A person can start the same work with workflow_dispatch.
# scripts/build-chart.sh verifies the release and writes the chart. This
# workflow opens a pull request with the chart.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in the policies repository, for example ControllerContainerBlockSysctls/v1.0.6"
        required: true
        type: string
      policy-name:
        description: "Upstream directory name of the policy, for example ControllerContainerBlockSysctls"
        required: true
        type: string
      release-version:
        description: "Release version, for example 1.0.6 or 1.0.6+suse.1"
        required: true
        type: string
      oci-tag:
        description: "OCI tag of the policy, for example v1.0.6 or v1.0.6_suse.1"
        required: true
        type: string
  repository_dispatch:
    types: [release-policy]

permissions: {}

# Two requests for the same policy write the same chart directory.
concurrency:
  group: release-policy-${{ github.event.client_payload.policy_name || inputs.policy-name }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # A fork sets this repository variable to build charts from its own
      # policies repository.
      POLICIES_REPOSITORY: ${{ vars.POLICIES_REPOSITORY || 'rancher/suse-security-policies' }}
      # The host of the Rancher Prime registry comes from Vault in the policies
      # repository. A default here could go out of date, so there is none.
      POLICIES_OCI_BASE: ${{ vars.POLICIES_OCI_BASE }}
      # The request values come in through the environment, never inline, so
      # no request value can change a shell command.
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      POLICY_NAME: ${{ github.event.client_payload.policy_name || inputs.policy-name }}
      RELEASE_VERSION: ${{ github.event.client_payload.release_version || inputs.release-version }}
      OCI_TAG: ${{ github.event.client_payload.oci_tag || inputs.oci-tag }}
      SOURCE_REPOSITORY: ${{ github.event.client_payload.owner && format('{0}/{1}', github.event.client_payload.owner, github.event.client_payload.repo) || '' }}
      # renovate: datasource=github-releases depName=kubewarden/adm-controller
      KWCTL_VERSION: v1.39.0
      # renovate: datasource=github-releases depName=sigstore/cosign
      COSIGN_VERSION: v3.1.3
      # renovate: datasource=github-releases depName=helm/helm
      HELM_VERSION: v4.3.2
    steps:
      - name: Check the configuration
        run: |
          if [ -z "$POLICIES_OCI_BASE" ]; then
            echo "::error::the repository variable POLICIES_OCI_BASE is empty or not set. Set it to the host of the Rancher Prime registry, followed by /rancher/suse-security-policies. README.md, section Configuration, tells where the host comes from"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A branch for the tag has a pull request that is open or merged, or
      # that a person closed without a merge to stop the chart. A branch
      # without a pull request remains when an earlier run failed after the
      # push. Nobody checked that branch, so the run stops, and a person must
      # delete the branch or open the pull request. The full ref name stops
      # ls-remote from matching a branch that only ends with the same name.
      - name: Check for an earlier pull request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release-policy/${TAG}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          heads="$(git ls-remote --heads origin "refs/heads/${branch}")"
          if [ -z "$heads" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            states="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json state --jq '.[].state')"
            if [ -z "$states" ]; then
              echo "::error::the branch ${branch} exists without a pull request, because an earlier run failed after the push. Delete the branch, or open the pull request by hand"
              exit 1
            fi
            echo "::notice::the branch ${branch} has a pull request (${states//$'\n'/, }), so the chart for ${TAG} needs no new one. Nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # The App token action needs the owner and the repository name apart.
          echo "policies-owner=${POLICIES_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "policies-name=${POLICIES_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.request.outputs.skip == 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pkg2chart/go.mod
          cache-dependency-path: pkg2chart/go.sum

      - name: Install kwctl
        if: steps.request.outputs.skip == 'false'
        uses: kubewarden/github-actions/kwctl-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
        with:
          kwctl-version: ${{ env.KWCTL_VERSION }}

      # The kwctl installer runs its own cosign-installer, which writes an
      # older cosign to $HOME/.cosign/cosign. This step must come after it,
      # because it writes the pinned cosign to the same file.
      - name: Install cosign
        if: steps.request.outputs.skip == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install Helm
        if: steps.request.outputs.skip == 'false'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
          checksum-policy: required

      # The policies repository is private, so the release assets need a token.
      - name: Generate the token to read the policies repository
        if: steps.request.outputs.skip == 'false'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.request.outputs.policies-owner }}
          repositories: ${{ steps.request.outputs.policies-name }}
          permission-contents: read

      # pkg2chart changes nothing if the chart already has the same version or
      # a newer one.
      - name: Build the chart
        if: steps.request.outputs.skip == 'false'
        id: build
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          scripts/build-chart.sh
          if [ -z "$(git status --porcelain -- "charts/${POLICY_NAME}")" ]; then
            echo "The chart did not change, so there is no pull request"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub starts no pull_request workflow for a pull request that
      # GITHUB_TOKEN opens, so this is the only check before the merge. Only
      # errors fail the lint. The charts have no templates and no icon, which
      # helm reports as a warning and as information.
      - name: Lint the chart
        if: steps.build.outputs.changed == 'true'
        run: helm lint "charts/${POLICY_NAME}"

      - name: Create the pull request
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          title="chore: update policy ${POLICY_NAME} to ${RELEASE_VERSION}"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "charts/${POLICY_NAME}"
          git commit -m "$title"
          git push origin "$BRANCH"
          gh pr create \
            --title "$title" \
            --body "Updates the chart of ${POLICY_NAME} to the release [${TAG}](https://github.com/${POLICIES_REPOSITORY}/releases/tag/${TAG})." \
            --base main \
            --head "$BRANCH"
