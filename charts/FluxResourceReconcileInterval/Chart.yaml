annotations:
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Resource Reconcile Interval Must Be Set Between Lower and
    Upper Bound
  kubewarden/mutation: "false"
  kubewarden/resources: HelmRelease, GitRepository, OCIRepository, Bucket, HelmChart,
    HelmRepository, Kustomization
  kubewarden/rules: |
    - apiGroups:
      - helm.toolkit.fluxcd.io
      apiVersions:
      - v2
      resources:
      - helmreleases
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1
      resources:
      - gitrepositories
      - ocirepositories
      - buckets
      - helmcharts
      - helmrepositories
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - kustomize.toolkit.fluxcd.io
      apiVersions:
      - v1
      resources:
      - kustomizations
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 1.0.7
description: The reconcile interval of a Resource must be set between a lower and
  upper bound, lower_bound & upper_bound must be in seconds .
home: https://github.com/rancher/suse-security-policies
keywords:
- flux
name: resource-reconcile-interval
sources:
- oci://registry.rancher.com/rancher/suse-security-policies/resource-reconcile-interval:v1.0.7
version: 1.0.7
