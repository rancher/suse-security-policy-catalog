annotations:
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Resource Suspend Waiver
  kubewarden/mutation: "false"
  kubewarden/resources: HelmRelease, GitRepository, OCIRepository, Bucket, HelmChart,
    HelmRepository, Kustomization
  kubewarden/rules: |
    - apiGroups:
      - helm.toolkit.fluxcd.io
      apiVersions:
      - v2
      resources:
      - helmreleases
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - source.toolkit.fluxcd.io
      apiVersions:
      - v1
      resources:
      - gitrepositories
      - ocirepositories
      - buckets
      - helmcharts
      - helmrepositories
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - kustomize.toolkit.fluxcd.io
      apiVersions:
      - v1
      resources:
      - kustomizations
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 1.0.6
description: Resource cannot be suspended unless it's on the waiver list.
home: https://github.com/rancher/suse-security-policies
keywords:
- flux
name: resource-suspend-waiver
sources:
- oci://registry.rancher.com/rancher/suse-security-policies/resource-suspend-waiver:v1.0.6
version: 1.0.6
