  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Network Allow Ingress Traffic From Namespace To Another
  kubewarden/mutation: "false"
  kubewarden/resources: NetworkPolicy
  kubewarden/rules: |
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      resources:
      - networkpolicies
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 1.0.6
description: |-
  If you are using a CNI that allows for Network Policies, you can use this Policy to allow Ingress traffic from one namespace to another.

  By default, if no policies exist in a namespace, then all ingress and egress traffic is allowed to and from pods in that namespace.
