annotations:
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: High Risk Service Account
  kubewarden/mutation: "false"
  kubewarden/resources: Pod
  kubewarden/rules: |
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - replicationcontrollers
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - batch
      apiVersions:
      - v1
      resources:
      - jobs
      - cronjobs
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 0.1.12
description: Policy to prevent the usage of serviceaccount with too many permissions
home: https://github.com/rancher/suse-security-policies
keywords:
- pod
- security
- serviceaccount
name: high-risk-service-account
sources:
- oci://registry.rancher.com/rancher/suse-security-policies/high-risk-service-account:v0.1.12
version: 0.1.12
