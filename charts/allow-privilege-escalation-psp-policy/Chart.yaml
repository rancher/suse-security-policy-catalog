annotations:
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Allow Privilege Escalation PSP
  kubewarden/mutation: "true"
  kubewarden/resources: Deployment,Replicaset,Statefulset,Daemonset,Replicationcontroller,Job,Cronjob,Pod
  kubewarden/rules: |
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - replicationcontrollers
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - batch
      apiVersions:
      - v1
      resources:
      - jobs
      - cronjobs
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 1.0.16
description: Replacement for the Kubernetes Pod Security Policy that controls the
  allowance of privilege escalation in containers and init containers of a pod
home: https://github.com/rancher/suse-security-policies
keywords:
- PSP
- privilege escalation
name: allow-privilege-escalation-psp
sources:
- oci://registry.rancher.com/rancher/suse-security-policies/allow-privilege-escalation-psp:v1.0.16
version: 1.0.16
