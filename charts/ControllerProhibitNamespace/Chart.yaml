annotations:
  catalog.cattle.io/hidden: "true"
  catalog.cattle.io/type: kubewarden-policy
  catalog.cattle.io/ui-component: kubewarden
  kubewarden/displayName: Containers Should Not Run In Namespace
  kubewarden/mutation: "false"
  kubewarden/resources: Pod, Deployment, Job, ReplicationController, ReplicaSet, DaemonSet,
    StatefulSet, CronJob
  kubewarden/rules: |
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      - replicationcontrollers
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - batch
      apiVersions:
      - v1
      resources:
      - jobs
      - cronjobs
      operations:
      - CREATE
      - UPDATE
apiVersion: v2
appVersion: 1.0.6
description: This Policy ensure workloads are not running in a specified namespace.
home: https://github.com/rancher/suse-security-policies
keywords:
- cis-benchmark
- soc2-type1
name: containers-should-not-run-in-namespace
sources:
- oci://registry.rancher.com/rancher/suse-security-policies/containers-should-not-run-in-namespace:v1.0.6
version: 1.0.6
